name: aiscroll
description: "Learn AI in Seconds, One Scroll at a Time"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  shared_preferences: ^2.2.3
  dio: ^5.4.3+1
  share_plus: ^12.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.0
  # Firebase App Check for Flutter ↔ admin device attestation.
  firebase_core: ^3.6.0
  firebase_app_check: ^0.3.1+7
  # Firebase Cloud Messaging — news push notifications.
  firebase_messaging: ^15.1.3
  # Firebase Auth (Google Sign-In + email/password providers).
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  # Cloud Firestore — server-of-truth for signed-in user profiles.
  cloud_firestore: ^5.4.4
  # AdMob — native + rewarded ads for monetisation.
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
